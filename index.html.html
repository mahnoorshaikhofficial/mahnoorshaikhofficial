<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My To-Do List</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #eef3f8; --card: #ffffff; --text: #1b2a3a; --muted: #6b7c8f;
  --line: #d9e2ec; --accent: #1f6feb; --accent-text: #ffffff; --done: #8a9bad;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1722; --card: #182333; --text: #e6edf5; --muted: #8fa1b5;
    --line: #2a3a4f; --accent: #4c8dff; --accent-text: #0b1220; --done: #62758a;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1722; --card: #182333; --text: #e6edf5; --muted: #8fa1b5;
  --line: #2a3a4f; --accent: #4c8dff; --accent-text: #0b1220; --done: #62758a;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  display: flex; justify-content: center; padding: 24px 14px;
}
.app {
  width: 100%; max-width: 460px; background: var(--card);
  border: 1px solid var(--line); border-radius: 14px; padding: 22px;
}
h1 { margin: 0 0 4px; font-size: 1.6rem; }
.sub { margin: 0 0 18px; color: var(--muted); font-size: .95rem; }
.add { display: flex; gap: 8px; }
.add input {
  flex: 1; min-width: 0; padding: 11px 12px; font-size: 1rem;
  border: 1px solid var(--line); border-radius: 8px;
  background: var(--bg); color: var(--text);
}
button {
  font: inherit; cursor: pointer; border-radius: 8px;
  border: 1px solid var(--line); background: var(--bg); color: var(--text);
}
.add button {
  padding: 0 16px; background: var(--accent); color: var(--accent-text);
  border-color: var(--accent); font-weight: 600;
}
input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.filters { display: flex; gap: 6px; margin: 16px 0 8px; }
.filters button { padding: 6px 12px; font-size: .9rem; }
.filters button.on { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
ul { list-style: none; margin: 0; padding: 0; }
li {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 2px; border-bottom: 1px solid var(--line);
}
li input[type="checkbox"] { width: 20px; height: 20px; accent-color: var(--accent); flex: none; }
li span { flex: 1; word-break: break-word; }
li.done span { text-decoration: line-through; color: var(--done); }
li .del { padding: 4px 10px; color: var(--muted); }
.empty { color: var(--muted); text-align: center; padding: 22px 0; }
.foot { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; color: var(--muted); font-size: .9rem; }
.foot button { padding: 5px 10px; font-size: .85rem; }
</style>
</head>
<body>
<main class="app">
  <h1>My To-Do List</h1>
  <p class="sub">Write a task, press Add, and tick it when done.</p>

  <div class="add">
    <input id="taskInput" type="text" placeholder="Write a new task" aria-label="New task" maxlength="120">
    <button id="addBtn">Add task</button>
  </div>

  <div class="filters" id="filters">
    <button data-f="all" class="on">All</button>
    <button data-f="active">Not done</button>
    <button data-f="done">Done</button>
  </div>

  <ul id="list"></ul>

  <div class="foot">
    <span id="count"></span>
    <button id="clearBtn">Clear done tasks</button>
  </div>
</main>

<script>
var tasks = [];
var filter = "all";
var KEY = "simple-todo-tasks";

try {
  var saved = localStorage.getItem(KEY);
  if (saved) tasks = JSON.parse(saved);
} catch (e) { tasks = []; }

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch (e) {}
}

function render() {
  var list = document.getElementById("list");
  list.innerHTML = "";
  var shown = tasks.filter(function (t) {
    if (filter === "active") return !t.done;
    if (filter === "done") return t.done;
    return true;
  });

  if (shown.length === 0) {
    var empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = tasks.length === 0 ? "No tasks yet. Add your first task above." : "No tasks in this list.";
    list.appendChild(empty);
  }

  shown.forEach(function (t) {
    var li = document.createElement("li");
    if (t.done) li.className = "done";

    var box = document.createElement("input");
    box.type = "checkbox";
    box.checked = t.done;
    box.setAttribute("aria-label", "Mark done");
    box.onchange = function () { t.done = box.checked; save(); render(); };

    var text = document.createElement("span");
    text.textContent = t.text;

    var del = document.createElement("button");
    del.className = "del";
    del.textContent = "Delete";
    del.onclick = function () {
      tasks = tasks.filter(function (x) { return x.id !== t.id; });
      save(); render();
    };

    li.appendChild(box); li.appendChild(text); li.appendChild(del);
    list.appendChild(li);
  });

  var left = tasks.filter(function (t) { return !t.done; }).length;
  document.getElementById("count").textContent = left + (left === 1 ? " task left" : " tasks left");
}

function addTask() {
  var input = document.getElementById("taskInput");
  var value = input.value.trim();
  if (!value) { input.focus(); return; }
  tasks.push({ id: Date.now(), text: value, done: false });
  input.value = "";
  save(); render();
}

document.getElementById("addBtn").onclick = addTask;
document.getElementById("taskInput").onkeydown = function (e) {
  if (e.key === "Enter") addTask();
};

document.getElementById("clearBtn").onclick = function () {
  tasks = tasks.filter(function (t) { return !t.done; });
  save(); render();
};

document.querySelectorAll("#filters button").forEach(function (b) {
  b.onclick = function () {
    filter = b.getAttribute("data-f");
    document.querySelectorAll("#filters button").forEach(function (x) { x.classList.remove("on"); });
    b.classList.add("on");
    render();
  };
});

render();
</script>
</body>
</html>
